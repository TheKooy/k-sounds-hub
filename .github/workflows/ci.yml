name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libopengl0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Validate launch contract
        run: |
          python scripts/check_launch_contract.py
          python scripts/check_install_contract.py
          python scripts/check_runtime_lifecycle_contract.py
          python scripts/check_version_consistency.py

      - name: Validate isolated install lifecycle
        run: ./scripts/test_install_lifecycle.sh

      - name: Build native runtime components
        run: ./scripts/build_ksound_native_engine.sh "$PWD"

      - name: Install Qt multimedia runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0

      - name: Run tests
        run: pytest
