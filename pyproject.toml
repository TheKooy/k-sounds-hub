[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "k-sounds-hub"
dynamic = ["version"]
description = "PipeWire-first modular Linux audio hub"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Kooy" }
]
dependencies = [
  "PySide6>=6.6",
  "numpy>=1.26"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]

[project.scripts]
k-sounds-hub = "ksound_hub.glass_app:main"
ksound-hub = "ksound_hub.glass_app:main"
ksound-control = "ksound_hub.control:main"
k-sounds-hub-glass = "ksound_hub.glass_app:main"
ksound-hub-glass = "ksound_hub.glass_app:main"
k-sounds-hub-classic = "ksound_hub.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ksound_hub = [
  "assets/*",
  "assets/**/*"
]

[tool.setuptools.dynamic]
version = {attr = "ksound_hub._version.__version__"}

[tool.ruff]
line-length = 100
target-version = "py311"
